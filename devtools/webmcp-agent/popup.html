<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Folio agent probe</title>
    <style>
      /* A developer harness, not an app surface: system monospace, tight rows,
         and no chrome of its own. */
      :root {
        color-scheme: light dark;
        --ink: #1c1c1b;
        --dim: #6b6a66;
        --line: #d8d6cd;
        --fill: #f5f4ed;
        --accent: #1b365d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8e6df;
          --dim: #9b998f;
          --line: #3a3936;
          --fill: #1d1c1a;
          --accent: #8fb3e0;
        }
      }
      body {
        width: 440px;
        margin: 0;
        padding: 10px 12px 12px;
        font: 12px/1.45 ui-monospace, 'Cascadia Code', Consolas, monospace;
        color: var(--ink);
        background: var(--fill);
      }
      h1 {
        margin: 0 0 2px;
        font-size: 12px;
        font-weight: 600;
      }
      p.hint {
        margin: 0 0 8px;
        color: var(--dim);
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      button {
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      ul#tools {
        margin: 8px 0;
        padding: 0;
        max-height: 168px;
        overflow-y: auto;
        list-style: none;
        border-top: 1px solid var(--line);
      }
      ul#tools li {
        padding: 5px 2px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      ul#tools li[aria-selected='true'] {
        color: var(--accent);
      }
      .name {
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      .chips {
        display: flex;
        gap: 4px;
      }
      .chip {
        padding: 0 4px;
        border-radius: 3px;
        border: 1px solid var(--line);
        color: var(--dim);
        font-size: 10px;
      }
      .desc {
        color: var(--dim);
        font-size: 11px;
      }
      label {
        display: block;
        margin: 10px 0 3px;
        color: var(--dim);
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 68px;
        padding: 5px 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        resize: vertical;
      }
      pre#result {
        margin: 8px 0 0;
        padding: 6px 7px;
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 4px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      pre#result:empty {
        display: none;
      }
      .error {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <h1>Folio agent probe</h1>
    <p class="hint" id="state">Reading this page's tools…</p>
    <div class="row">
      <button id="reload" type="button">Reload tools</button>
      <button id="run" type="button" disabled>Run</button>
    </div>
    <ul id="tools" role="listbox" aria-label="Tools declared by the page"></ul>
    <label for="input">Input (JSON, as the tool's schema takes it)</label>
    <textarea id="input" spellcheck="false"></textarea>
    <pre id="result" role="status" aria-live="polite"></pre>
    <script src="popup.js"></script>
  </body>
</html>
