<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-label="A Markdown folder becomes an index, which fills three panes">
  <rect width="640" height="220" fill="#f5f4ed"/>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="24" y="64" width="160" height="92" rx="10" fill="#e7e1d3" stroke="#1b365d" stroke-width="2"/>
    <text x="104" y="98" text-anchor="middle" font-size="17" font-weight="600" fill="#1b365d">Markdown folder</text>
    <text x="104" y="122" text-anchor="middle" font-size="12" fill="#6b6257">pages · journals</text>
    <text x="104" y="140" text-anchor="middle" font-size="12" fill="#6b6257">boards · assets</text>

    <rect x="240" y="64" width="160" height="92" rx="10" fill="#e7e1d3" stroke="#1b365d" stroke-width="2"/>
    <text x="320" y="98" text-anchor="middle" font-size="17" font-weight="600" fill="#1b365d">Folio index</text>
    <text x="320" y="122" text-anchor="middle" font-size="12" fill="#6b6257">references · links</text>
    <text x="320" y="140" text-anchor="middle" font-size="12" fill="#6b6257">search · reminders</text>

    <rect x="456" y="64" width="160" height="92" rx="10" fill="#e7e1d3" stroke="#1b365d" stroke-width="2"/>
    <text x="536" y="98" text-anchor="middle" font-size="17" font-weight="600" fill="#1b365d">Three panes</text>
    <text x="536" y="122" text-anchor="middle" font-size="12" fill="#6b6257">navigate · read</text>
    <text x="536" y="140" text-anchor="middle" font-size="12" fill="#6b6257">write · link</text>

    <g stroke="#1b365d" stroke-width="2" fill="none">
      <path d="M188 110 H232"/>
      <path d="M224 104 L232 110 L224 116"/>
      <path d="M404 110 H448"/>
      <path d="M440 104 L448 110 L440 116"/>
    </g>

    <text x="320" y="196" text-anchor="middle" font-size="13" fill="#6b6257">The folder is the database. The app is a window over it.</text>
  </g>
</svg>
