name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The gates and the artifact belong to a job of their own, and deploy runs
  # after it. That is not tidiness: when `upload-pages-artifact` and
  # `deploy-pages` run in the same job, the artifact lookup can come back empty
  # a fraction of a second after the upload finalizes, and deploy fails with
  # "No artifacts named github-pages were found for this workflow run"
  # (actions/deploy-pages#451, the intermittent same-job race; re-running that
  # failed job uploads a second artifact and makes it worse, #338). The lookup
  # in a following job happens seconds later and does not race. GitHub's own
  # Pages starter workflows use the same two-job shape.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gate the app's own rules name: warnings are errors, formatting is
      # checked, and both suites run with the coverage thresholds. A commit that
      # breaks one of them must not reach the published build.
      - run: npx oxlint --deny-warnings
      - run: npm run fmt:check
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
