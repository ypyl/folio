name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gate the app's own rules name: warnings are errors, formatting is
      # checked, and both suites run with the coverage thresholds. A commit that
      # breaks one of them must not reach the published build.
      - run: npx oxlint --deny-warnings
      - run: npm run fmt:check
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
