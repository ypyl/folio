         a notched phone, and `interactive-widget=resizes-content` so the

         bottom of the editor (add-compact-mobile-shell, design D7). -->

      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <meta name="theme-color" content="#1B365D" />
    <title>Folio</title>
